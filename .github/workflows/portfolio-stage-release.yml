name: Prepare static GitHub Pages release candidate

# Builds docs/ on the isolated development branch. It never changes main
# and does not run any Pages deployment action.
on:
  push:
    branches: [chatgpt/portfolio-lab-v2]
    paths:
      - .github/workflows/portfolio-stage-release.yml
      - index.html
      - public/social-preview.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-static-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build the static bundle into docs
        run: |
          npm run build -- --outDir docs --emptyOutDir
          touch docs/.nojekyll
          test -s docs/index.html
          test -s docs/ai-evaluation/index.html
          test -s docs/assets/research-geographies.svg
      - name: Render the social sharing image from the authored editorial cover
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-release-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/kabiri-bule-portfolio/social-preview.html >/dev/null; then break; fi
            sleep 1
          done
          BROWSER=$(command -v google-chrome || command -v chromium || true)
          test -n "$BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=4500 --window-size=1200,630 --screenshot=docs/og-preview.png http://127.0.0.1:4173/kabiri-bule-portfolio/social-preview.html >/dev/null
          test -s docs/og-preview.png
      - name: Stage built files only on the development branch
        run: |
          test "$(git branch --show-current)" = "chatgpt/portfolio-lab-v2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/
          if ! git diff --cached --quiet; then
            git commit -m "Stage tested GitHub Pages bundle on development branch"
            git push origin HEAD:chatgpt/portfolio-lab-v2
          fi
