name: Portfolio development check

on:
  push:
    branches:
      - chatgpt/portfolio-lab-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Compile React/Vite
        run: npm run build
      - name: Lint authored source
        run: npx eslint src
      - name: Review screenshots and DOM smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/portfolio-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/kabiri-bule-portfolio/ >/dev/null; then break; fi
            sleep 1
          done
          BROWSER=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$BROWSER" ]; then echo "No Chromium browser found on runner"; exit 1; fi
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=6000 --window-size=1440,1000 --screenshot=portfolio-desktop.png --dump-dom http://127.0.0.1:4173/kabiri-bule-portfolio/ > portfolio-dom.html
          grep -q 'What does the evidence' portfolio-dom.html
          grep -q 'Move the decision boundary' portfolio-dom.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=6000 --window-size=390,844 --screenshot=portfolio-mobile.png http://127.0.0.1:4173/kabiri-bule-portfolio/ >/dev/null
          test -s portfolio-desktop.png
          test -s portfolio-mobile.png
      - name: Store review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-review-screenshots
          path: |
            portfolio-desktop.png
            portfolio-mobile.png
            portfolio-dom.html
          if-no-files-found: ignore
