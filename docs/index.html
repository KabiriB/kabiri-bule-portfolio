<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kabiri-bule-portfolio/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>site_revamp</title>
    <script type="module" crossorigin src="/kabiri-bule-portfolio/assets/index-DA0Ik-5h.js"></script>
    <link rel="stylesheet" crossorigin href="/kabiri-bule-portfolio/assets/index-Duyrbv2F.css">
  </head>
  <body>
    <div id="root"></div>
      <script>
      (function(){
        var root=document.getElementById('root');
        var observer=new MutationObserver(function(){
          var nav=document.querySelector('.site-nav');
          if(!nav) return;
          if(!nav.querySelector('[data-analytics-link]')){
            var a=document.createElement('a');
            a.href='/kabiri-bule-portfolio/analytics.html';
            a.textContent='Analytics cases';
            a.setAttribute('data-analytics-link','true');
            nav.insertBefore(a,nav.firstChild);
          }
          observer.disconnect();
        });
        observer.observe(root,{childList:true,subtree:true});
        if(document.querySelector('.site-nav')) observer.takeRecords();
      })();
    </script>

    <style>
      #portfolio-return-dock{position:fixed;right:18px;bottom:18px;z-index:90;display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 12px;background:rgba(13,32,46,.95);color:#fff;border:1px solid rgba(216,183,122,.6);border-radius:12px;box-shadow:0 15px 35px rgba(0,0,0,.24);font:600 13px/1.35 system-ui,sans-serif;backdrop-filter:blur(14px)}
      #portfolio-return-dock a{color:#f1d5a0;text-decoration:none;padding:6px 5px;border-radius:4px}
      #portfolio-return-dock a:hover,#portfolio-return-dock a:focus-visible{color:#fff;text-decoration:underline}
      @media(max-width:560px){#portfolio-return-dock{left:12px;right:12px;justify-content:center;bottom:10px;padding:8px;font-size:12px}}
    </style>
    <nav id="portfolio-return-dock" aria-label="Return navigation">
      <a href="#studios">← Back to studio list</a>
      <a href="/kabiri-bule-portfolio/analytics.html#work">All case studies ↗</a>
      <a href="#top">↑ Top</a>
    </nav>
    <script>
      (function(){
        const dock=document.getElementById('portfolio-return-dock');
        const known=new Set(['executive-signal-room','governance-pressure-observatory','resource-conversion-lab','retail-strain-simulator']);
        function updateDock(){
          const active=decodeURIComponent(location.hash.slice(1));
          dock.style.display=known.has(active)?'flex':'none';
        }
        window.addEventListener('hashchange',updateDock);
        updateDock();
        // The main portfolio is rendered by React. Resolve direct links to its sections
        // after those elements exist so an incoming case link reaches the right studio.
        const target=decodeURIComponent(location.hash.slice(1));
        if(known.has(target)){
          const root=document.getElementById('root');
          const observer=new MutationObserver(function(){
            const node=document.getElementById(target);
            if(node){node.scrollIntoView({block:'start'});observer.disconnect();}
          });
          observer.observe(root,{childList:true,subtree:true});
          const node=document.getElementById(target);
          if(node){node.scrollIntoView({block:'start'});observer.disconnect();}
        }
      })();
    </script>
</body>
</html>
